{% extends "base.html" %}
{% block title %}Pago registrado{% endblock %}
{% block content %}
<div class="max-w-md mx-auto space-y-4 text-center">
  <div class="bg-panel rounded-2xl border border-slate-700 p-4">
    <div class="w-10 h-10 mx-auto mb-2 rounded-full bg-emerald-900/50 flex items-center justify-center">
      <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1 class="text-base font-bold text-white mb-0.5">¡Pago registrado!</h1>
    <p class="text-slate-400 text-xs">{{ nombre }} · Cuota #{{ num_cuota }} · <strong class="text-accent">{{ fmt_money(valor) }}</strong></p>
  </div>

  <!-- Vista previa directa del recibo limpia para captura -->
  <div class="bg-white rounded-2xl p-3 shadow-2xl overflow-hidden border border-slate-300">
    <p class="text-[10px] font-bold text-center text-slate-500 uppercase tracking-widest mb-2">📸 Toma captura de este recibo</p>
    <div class="overflow-x-auto flex justify-center">
      <img src="{{ img_url }}" alt="Recibo de pago" class="rounded-xl shadow-md max-w-full h-auto max-h-[500px] object-contain border border-slate-200">
    </div>
  </div>

  <a href="{{ url_for('prestamos_list') }}" class="inline-block mt-2 text-xs font-bold text-accent hover:underline">← Volver a préstamos</a>
</div>
{% endblock %}
