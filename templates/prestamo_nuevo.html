{% extends "base.html" %}
{% block title %}Nuevo préstamo{% endblock %}
{% block content %}
<h1 class="text-xl font-bold mb-4">Nuevo préstamo</h1>
<form method="post" class="relative space-y-3 bg-panel rounded-2xl border border-slate-700 p-4" data-loading-submit data-loading-label="Procesando…" id="form-prestamo">
  <input type="hidden" name="cliente_id" id="cliente_id" required>

  <label class="block text-sm text-slate-400">Buscar cliente</label>
  <div class="relative">
    <input type="text" id="buscador-cliente"
           class="w-full rounded-xl bg-panel2 border border-slate-600 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent"
           placeholder="Nombre, cédula o teléfono…" autocomplete="off">
    <div id="resultados-cliente" class="hidden absolute z-50 mt-1 w-full bg-panel2 border border-slate-600 rounded-xl max-h-48 overflow-y-auto shadow-xl"></div>
  </div>
  <p id="cliente-seleccionado" class="text-xs text-accent hidden"></p>

  <input type="date" name="fecha" value="{{ today_str() }}" class="w-full rounded-xl bg-panel2 border border-slate-600 px-3 py-2 text-white">
  <select name="frecuencia" class="w-full rounded-xl bg-panel2 border border-slate-600 px-3 py-2 text-white">
    <option value="diaria">Diaria</option>
    <option value="semanal">Semanal</option>
    <option value="quincenal">Quincenal</option>
    <option value="mensual" selected>Mensual</option>
  </select>
  <input name="cuotas" type="number" min="1" value="1" placeholder="Cuotas" class="w-full rounded-xl bg-panel2 border border-slate-600 px-3 py-2 text-white">
  <input name="monto" type="number" step="0.01" min="0" placeholder="Monto" required class="w-full rounded-xl bg-panel2 border border-slate-600 px-3 py-2 text-white">
  <input name="tasa" type="number" step="0.01" min="0" placeholder="Tasa % sobre monto" required class="w-full rounded-xl bg-panel2 border border-slate-600 px-3 py-2 text-white">
  <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
    <input type="checkbox" name="mora_activa" value="on" class="rounded border-slate-600">
    <span>Habilitar interés por mora</span>
  </label>
  <input name="tasa_mora_diaria" type="number" min="0" step="0.01" placeholder="% mora diario (sobre la cuota)" class="w-full rounded-xl bg-panel2 border border-slate-600 px-3 py-2 text-white">
  <p class="text-xs text-slate-500">Al cobrar con retraso, se suma mora = cuota × % × días de atraso.</p>

  <button type="button" id="btn-calcular" class="w-full py-3 rounded-xl font-bold border-2 border-accent text-accent hover:bg-accent/10 transition-colors">
    Calcular préstamo
  </button>

  <div id="resultado-calculo" class="hidden rounded-2xl border-2 border-accent bg-panel2 p-4 space-y-2">
    <h3 class="text-sm font-bold text-accent uppercase tracking-wide">Resumen del préstamo</h3>
    <div class="grid grid-cols-2 gap-2 text-sm">
      <div>
        <p class="text-slate-500 text-[10px] uppercase font-bold">Interés total</p>
        <p id="calc-interes" class="text-white font-semibold"></p>
      </div>
      <div>
        <p class="text-slate-500 text-[10px] uppercase font-bold">Total a pagar</p>
        <p id="calc-total" class="text-accent font-bold"></p>
      </div>
      <div>
        <p class="text-slate-500 text-[10px] uppercase font-bold">Valor por cuota</p>
        <p id="calc-cuota" class="text-white font-semibold"></p>
      </div>
      <div>
        <p class="text-slate-500 text-[10px] uppercase font-bold">Vencimiento est.</p>
        <p id="calc-vencimiento" class="text-white font-semibold"></p>
      </div>
    </div>
  </div>

  <button type="submit" class="w-full py-3 rounded-xl bg-accent text-slate-900 font-bold">Guardar</button>
</form>

<script>
(function() {
  var input = document.getElementById('buscador-cliente');
  var resultados = document.getElementById('resultados-cliente');
  var hiddenId = document.getElementById('cliente_id');
  var label = document.getElementById('cliente-seleccionado');
  var form = document.getElementById('form-prestamo');
  var timeout = null;

  input.addEventListener('input', function() {
    clearTimeout(timeout);
    var q = input.value.trim();
    label.classList.add('hidden');
    if (q.length < 2) {
      resultados.classList.add('hidden');
      resultados.innerHTML = '';
      hiddenId.value = '';
      return;
    }
    timeout = setTimeout(function() {
      fetch('/api/buscar_clientes?q=' + encodeURIComponent(q))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.length) {
            resultados.innerHTML = '<div class="px-3 py-2 text-xs text-slate-500">Sin resultados</div>';
            resultados.classList.remove('hidden');
            return;
          }
          resultados.innerHTML = data.map(function(c) {
            return '<div class="px-3 py-2 text-sm cursor-pointer hover:bg-slate-700 border-b border-slate-700 last:border-0 cliente-item" data-id="' + c.id + '" data-nombre="' + c.nombre + '">' + c.nombre + ' — ' + c.identificacion + '</div>';
          }).join('');
          resultados.classList.remove('hidden');
        });
    }, 250);
  });

  resultados.addEventListener('click', function(e) {
    var item = e.target.closest('.cliente-item');
    if (!item) return;
    hiddenId.value = item.dataset.id;
    input.value = item.dataset.nombre;
    label.textContent = 'Cliente seleccionado: ' + item.dataset.nombre;
    label.classList.remove('hidden');
    resultados.classList.add('hidden');
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#buscador-cliente') && !e.target.closest('#resultados-cliente')) {
      resultados.classList.add('hidden');
    }
  });

  form.addEventListener('submit', function(e) {
    if (!hiddenId.value) {
      e.preventDefault();
      alert('Selecciona un cliente de la lista.');
      input.focus();
    }
  });

  var btnCalc = document.getElementById('btn-calcular');
  var resCalc = document.getElementById('resultado-calculo');
  if (btnCalc) {
    btnCalc.addEventListener('click', function() {
      var monto = parseFloat(document.querySelector('input[name="monto"]').value);
      var tasa = parseFloat(document.querySelector('input[name="tasa"]').value);
      var cuotas = parseInt(document.querySelector('input[name="cuotas"]').value, 10);
      var fecha = document.querySelector('input[name="fecha"]').value;
      var frecuencia = document.querySelector('select[name="frecuencia"]').value;

      if (!Number.isFinite(monto) || monto <= 0 || !Number.isFinite(tasa) || tasa < 0 || !Number.isFinite(cuotas) || cuotas < 1) {
        alert('Completa monto, tasa y cuotas con valores válidos.');
        return;
      }

      var interes = monto * (tasa / 100);
      var total = monto + interes;
      var valorCuota = total / cuotas;

      var diasPorFrec = { diaria: 1, semanal: 7, quincenal: 15, mensual: 30 };
      var dias = diasPorFrec[frecuencia] || 30;
      var vencDate = new Date(fecha + 'T00:00:00');
      vencDate.setDate(vencDate.getDate() + dias * cuotas);
      var vencStr = vencDate.toISOString().slice(0, 10);

      var fmt = function(n) {
        return '$' + new Intl.NumberFormat('es-CO', { maximumFractionDigits: 0 }).format(n);
      };

      document.getElementById('calc-interes').textContent = fmt(interes);
      document.getElementById('calc-total').textContent = fmt(total);
      document.getElementById('calc-cuota').textContent = fmt(valorCuota);
      document.getElementById('calc-vencimiento').textContent = vencStr;
      resCalc.classList.remove('hidden');
    });
  }
})();
</script>
{% endblock %}
